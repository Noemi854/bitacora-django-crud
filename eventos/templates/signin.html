{% extends 'base.html' %} {% block content %}

<main class="container">
  <div class="row">
    <section class="col-md-4 offset-md-4">
      <form action="/signin/" method="POST" class="card card-body mt-5">
        <h1 class="text-center">Iniciar Sesión</h1>
        {{error}} {% csrf_token %}

        <div class="mb-3">
          <label for="username" class="form-label">Nombre de Usuario</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            required
            placeholder="Escribe tu nombre"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
            placeholder="Escribe tu contraseña"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Iniciar Sesión
        </button>
        <pc class="mt-3">¿No tienes cuenta? <a href="/signup/">Regístrate aquí</a></p>
      </form>
    </section>
  </div>
</main>
{% endblock %}
