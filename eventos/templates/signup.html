{% extends 'base.html' %} 
{% block content %}

<main class="container">
  <div class="row">
    <div class="col-md-4 offset-md-4 mt-5">
      <form method="POST" class="card card-body">
            <h1 class="text-center">Registro de Usuario</h1>
            {{error}} 
            {% csrf_token %} 
            
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Escribe tu nombre">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="Escribe tu correo">
            </div>

            <div class="mb-3">1
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password1" name="password1" required placeholder="Escribe tu contraseña">
            </div>

            <div class="mb-3">
                <label for="password2" class="form-label">Repite tu contraseña</label>
                <input type="password" class="form-control" id="password2" name="password2" required placeholder="Escribe tu contraseña de nuevo">
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrarse</button>


            <p class="mt-3">¿Ya tienes una cuenta? <a href="/signin/">Inicia sesión aquí</a></p>
      </form>
    </div>
  </div>
</main>

{% endblock %}
